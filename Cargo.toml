[package]
name = "range-map-regex"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "demos/fsm-demo"]
# Plain `cargo` commands build only the library; use `--workspace` for the demo.
default-members = ["."]

[dependencies]
indexmap = "2"
# TODO Return to `path = "../range-set-blaze"` (or a release) once
# `RangeMapBlaze::universe_with` and `inner_join` are merged into range-set-blaze's
# main branch. Until then they exist only on its `regex` branch. (may no longer apply)
# Now using the local checkout; check out range-set-blaze's `inner-join-universe`
# branch (PR #36) for `universe_with` and `inner_join`. Switch to a release once one ships.
range-set-blaze = { path = "../range-set-blaze" }
unicode-ident = "1"

[profile.dev]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.test]
opt-level = 3
debug-assertions = false
overflow-checks = false
