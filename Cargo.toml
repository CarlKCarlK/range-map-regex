[package]
name = "range-map-regex"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "demos/fsm-demo"]
# Plain `cargo` commands build only the library; use `--workspace` for the demo.
default-members = ["."]

[dependencies]
indexmap = "2"
# TODO Return to `path = "../range-set-blaze"` (or a release) once
# `RangeMapBlaze::universe_with` and `inner_join` are merged into range-set-blaze's
# main branch. Until then they exist only on its `regex` branch.
range-set-blaze = { git = "https://github.com/CarlKCarlK/range-set-blaze", branch = "regex" }
unicode-ident = "1"

[profile.dev]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.test]
opt-level = 3
debug-assertions = false
overflow-checks = false
